<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5;url=/">
  <title>Página não encontrada — High-Performance Team</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 48'%3E%3Crect x='0' y='8' width='12' height='32' rx='3' fill='%23D93B3B'/%3E%3Crect x='12' y='14' width='8' height='20' rx='2' fill='%23D93B3B'/%3E%3Crect x='20' y='20' width='80' height='8' rx='4' fill='%23D93B3B'/%3E%3Crect x='100' y='14' width='8' height='20' rx='2' fill='%23D93B3B'/%3E%3Crect x='108' y='8' width='12' height='32' rx='3' fill='%23D93B3B'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0A0A0B;color:#F0EBE1;font-family:'Segoe UI',system-ui,sans-serif;
         display:flex;align-items:center;justify-content:center;min-height:100vh;
         flex-direction:column;gap:24px;text-align:center;padding:24px;}
    .icon{animation:pulse 2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
    h1{font-size:clamp(28px,6vw,52px);font-weight:900;color:#fff;}
    p{color:#9A9AAA;font-size:15px;max-width:380px;line-height:1.6;}
    a{display:inline-flex;align-items:center;justify-content:center;
      padding:12px 32px;background:#D93B3B;color:#fff;border-radius:6px;
      font-weight:700;font-size:14px;letter-spacing:.03em;text-decoration:none;
      transition:background .25s ease,transform .25s ease;margin-top:8px;}
    a:hover{background:#FF5252;transform:translateY(-2px);}
    .counter{font-size:13px;color:#6A6A7A;}
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 120 48" fill="#D93B3B" width="80" height="32" aria-hidden="true">
    <rect x="0"   y="8"  width="12" height="32" rx="3"/>
    <rect x="12"  y="14" width="8"  height="20" rx="2"/>
    <rect x="20"  y="20" width="80" height="8"  rx="4"/>
    <rect x="100" y="14" width="8"  height="20" rx="2"/>
    <rect x="108" y="8"  width="12" height="32" rx="3"/>
  </svg>
  <h1>Página não encontrada</h1>
  <p>O endereço que você acessou não existe ou foi movido. Você será redirecionado automaticamente.</p>
  <a href="/">Voltar ao início</a>
  <p class="counter" id="ct">Redirecionando em 5 segundos…</p>
  <script>
    var s=5;var id=setInterval(function(){s--;document.getElementById('ct').textContent='Redirecionando em '+s+' segundo'+(s!==1?'s':'')+'…';if(s<=0){clearInterval(id);location.href='/';}},1000);
  </script>
</body>
</html>
