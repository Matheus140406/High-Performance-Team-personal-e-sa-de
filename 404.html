<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | High-Performance Team</title>
  <link rel="icon" type="image/png" href="/imagens/logo-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css?v=3.0">
  <script>
    (function () {
      var SITE_VERSION = '3.0';
      var VERSION_KEY = 'hpt-site-version';
      var THEME_KEY = 'hpt-theme';

      var storedVersion = null;
      try { storedVersion = localStorage.getItem(VERSION_KEY); } catch (e) {}

      if (storedVersion !== SITE_VERSION) {
        try {
          localStorage.removeItem(THEME_KEY);
          localStorage.removeItem('hpt-theme-default-dark-v1');
          localStorage.setItem(VERSION_KEY, SITE_VERSION);
        } catch (e) {}
      }

      var theme = 'dark';
      try { theme = localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) {}
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    .error-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--bg);
    }
    .error-code {
      font-family: 'Fraunces', sans-serif;
      font-size: clamp(5rem, 20vw, 9rem);
      line-height: 1;
      color: var(--red);
      letter-spacing: .02em;
    }
    .error-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
      margin: 8px 0 6px;
    }
    .error-sub {
      color: var(--sub);
      max-width: 420px;
      margin-bottom: 32px;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <img src="/imagens/logo-icon.png" alt="High-Performance Team" style="width:64px;height:64px;border-radius:50%;background:#fff;padding:6px;margin-bottom:24px;">
    <div class="error-code">404</div>
    <p class="error-title">Essa página fugiu do treino</p>
    <p class="error-sub">A página que você procura não existe ou foi movida. Volte para a home e continue sua evolução.</p>
    <a href="/" class="btn btn-primary">Voltar para o início</a>
  </div>
</body>
</html>
